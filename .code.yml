# .code.yml规范:
# https://iwiki.woa.com/pages/viewpage.action?pageId=289510758

branch:
  trunk_name: "main"
  branch_type_A:
    tag:
      pattern: "v${versionnumber}"
      versionnumber: "{Major-version}.{Feature-version}.{Fix-version}"
artifact:
  - path: "/"
    artifact_name: "go-loki"
    artifact_type: "lib"
    dependence_conf: "go.mod"
    repository_url: "https://git.woa.com/thor-family/loki/go-loki"
source:
  test_source:
    filepath_regex: [".*_test.go$"]
  auto_generate_source:
    filepath_regex:
      [
        ".*.pb.go$",
        ".*.trpc.go$",
        ".*.jce.go$",
        ".*_mock.go$",
      ]
  third_party_source:
    filepath_regex:
      [".*.h$", ".*.cpp$", ".*.a$", ".*.c$"]
code_review:
  restrict_labels:
    [
      "CR-编程规范",
      "CR-业务逻辑",
      "CR-边界逻辑",
      "CR-代码架构",
      "CR-性能影响",
      "CR-安全性",
      "CR-可测试性",
      "CR-可读性",
    ]

file:
  - path: "/.*"
    owners: ["kongjie","scottzhlin"]
    owner_rule: 0
    code_review:
      reviewers: ["kongjie","scottzhlin"]
