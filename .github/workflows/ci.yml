# Deliberately thin: fmt + vet + build + unit tests. No matrix, no layers —
# the suite is all-local (fake bridges, temp dirs) and finishes in ~1min. The
# trailing #80 node-parity tail is the only step that leaves the Go world: it
# checks out two Python repos (plaita, plaita-nodes) and diffs their live
# node registry against ir.SupportedNodeTypes().
#
# Gate parity: every step below has a `make` counterpart (`make ci`), and the
# skipped-test list has exactly one source of truth (scripts/ci-skip.txt) shared
# with the Makefile. The workflow shape itself is machine-checked first by
# scripts/ci-workflow-audit.sh: a floating `uses:`/`go-version:` turns the job red.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR runs supersede each other. Main runs must not: a cancelled run is red for
  # the landing gate, so cancelling main turns every queued merge into a false red.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to 40-char commit SHAs so a moved upstream tag/branch cannot change
      # what runs here. Bump the SHA and the trailing version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Tracks the module's `go` directive. `go-version: 'stable'` let the
          # toolchain move under the repo without a commit.
          go-version-file: go.mod

      - name: workflow audit
        run: bash scripts/ci-workflow-audit.sh

      - name: gofmt
        run: make fmt-check

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        # Skip list: scripts/ci-skip.txt (see AGENTS.md "已知问题"). The Makefile
        # reads the same file, so `make test` and CI cannot drift apart.
        run: go test ./... -count=1 -skip "$(cat scripts/ci-skip.txt)"

      # #80 node parity (same steps as `make node-parity`). The two authority
      # checkouts are data inputs and deliberately track `main` by branch: the
      # gate exists to turn red the moment either side adds a node type
      # unilaterally, so SHA-pinning them would defeat its purpose. The
      # SHA-pinning audit rule covers `uses:` actions only.
      - name: checkout plaita (python registry authority)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffkit/plaita
          ref: main
          persist-credentials: false
          path: plaita-authority

      - name: checkout plaita-nodes (plugin authority)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffkit/plaita-nodes
          ref: main
          persist-credentials: false
          path: plaita-nodes-authority

      - name: setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: install plaita + plaita-nodes
        # plaita first so plaita-nodes' `plaita>=0.5.0` resolves against the
        # checked-out authority, never a PyPI copy.
        run: |
          pip install ./plaita-authority
          pip install ./plaita-nodes-authority

      - name: node parity (python <-> go)
        run: make node-parity PLAITA_REPO=plaita-authority PLAITA_NODES_REPO=plaita-nodes-authority
