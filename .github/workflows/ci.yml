# Deliberately thin: fmt + vet + build + unit tests. No matrix, no layers —
# the suite is all-local (fake bridges, temp dirs) and finishes in ~1min.
#
# Gate parity: every step below has a `make` counterpart (`make ci`), and the
# skipped-test list has exactly one source of truth (scripts/ci-skip.txt) shared
# with the Makefile. The workflow shape itself is machine-checked first by
# scripts/ci-workflow-audit.sh: a floating `uses:`/`go-version:` turns the job red.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR runs supersede each other. Main runs must not: a cancelled run is red for
  # the landing gate, so cancelling main turns every queued merge into a false red.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to 40-char commit SHAs so a moved upstream tag/branch cannot change
      # what runs here. Bump the SHA and the trailing version comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Tracks the module's `go` directive. `go-version: 'stable'` let the
          # toolchain move under the repo without a commit.
          go-version-file: go.mod

      - name: workflow audit
        run: bash scripts/ci-workflow-audit.sh

      - name: gofmt
        run: make fmt-check

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        # Skip list: scripts/ci-skip.txt (see AGENTS.md "已知问题"). The Makefile
        # reads the same file, so `make test` and CI cannot drift apart.
        run: go test ./... -count=1 -skip "$(cat scripts/ci-skip.txt)"
