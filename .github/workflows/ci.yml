# Deliberately thin: build + vet + fmt + unit tests. No matrix, no layers —
# the suite is all-local (fake bridges, temp dirs) and finishes in ~1min.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        # Skips (see AGENTS.md "已知问题"):
        # - Test_today_eval / Test_now_eval: gomonkey time.Now patch flaky.
        # - test_execute_workflow_with_http_request_info: live-network test
        #   (asserts a real outbound request fails; depends on egress state).
        run: go test ./... -skip 'Test_today_eval|Test_now_eval|test_execute_workflow_with_http_request_info'
