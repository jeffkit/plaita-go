# Local hooks only. The previous config cloned hook code over `git://` — plaintext,
# unauthenticated, and disabled by GitHub years ago, so `pre-commit install` failed
# outright while the file still looked like a gate. It also re-ran the full test
# suite and `go mod tidy` on every commit.
#
# These hooks are the same `make` targets CI runs, so the local gate cannot drift.
minimum_pre_commit_version: "3.2.0"
repos:
  - repo: local
    hooks:
      - id: fmt-check
        name: gofmt (make fmt-check)
        entry: make fmt-check
        language: system
        pass_filenames: false
        files: '\.go$'

      - id: go-vet
        name: go vet (make vet)
        entry: make vet
        language: system
        pass_filenames: false
        files: '\.go$'

      - id: go-build
        name: go build (make build)
        entry: make build
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: go-test
        name: go test (make test)
        entry: make test
        language: system
        pass_filenames: false
        stages: [pre-push]
